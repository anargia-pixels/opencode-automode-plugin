name: Publish

# Publishes to npm when a GitHub release is published. Uses npm trusted
# publishing (OIDC), so no npm token is stored in this repository.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # lets npm verify this workflow and attach provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      - name: Check that the release tag matches package.json
        run: |
          version="v$(node -p 'require("./package.json").version')"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package.json $version"
            exit 1
          fi
      # prepublishOnly runs typecheck, tests, and the build.
      - run: npm publish
